name: Build Folia Web

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install

      # Android WebView 需要相对路径 base；网易云 API 写入前端
      - name: Build
        env:
          VITE_NETEASE_API_BASE: https://api-enhanced-five-ashy.vercel.app
        run: npm run build -- --base=./

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: folia-web-dist
          path: dist
