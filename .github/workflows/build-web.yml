name: Build Folia Web

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm install

      # 把下面换成你自己的网易云 API 地址
      - name: Build
        env:
          VITE_NETEASE_API_BASE: https://你的网易云API域名
        run: npm run build -- --base=./

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: folia-web-dist
          path: dist
